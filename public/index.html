<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OGFN Server</title>
  <style>
    :root { --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5d6470; --line: #d9dce2; --accent: #2f6fde; --ok: #1f8a4c; --bad: #c33b3b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --card: #1b1e25; --text: #eceef2; --muted: #9aa1ad; --line: #2e333d; --accent: #5b92f0; --ok: #46b97a; --bad: #e46a6a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
    main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button { flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--text); cursor: pointer; font: inherit; }
    .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; }
    button.go { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #msg { margin-top: 14px; font-size: .9rem; overflow-wrap: anywhere; }
    #msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>OGFN Server</h1>
  <p class="sub">Private server. Make an account, then log in from the game.</p>
  <div class="tabs" role="tablist">
    <button id="tab-register" role="tab" aria-selected="true">Sign up</button>
    <button id="tab-code" role="tab" aria-selected="false">Get login code</button>
  </div>

  <form id="register">
    <label for="r-email">E-mail</label>
    <input id="r-email" type="email" required autocomplete="email">
    <label for="r-name">Display name</label>
    <input id="r-name" required minlength="3" maxlength="16" autocomplete="username">
    <label for="r-pass">Password</label>
    <input id="r-pass" type="password" required minlength="8" autocomplete="new-password">
    <div id="invite-wrap" hidden>
      <label for="r-invite">Invite code</label>
      <input id="r-invite" autocomplete="off">
    </div>
    <button class="go" type="submit">Create account</button>
  </form>

  <form id="code" hidden>
    <label for="c-login">E-mail or display name</label>
    <input id="c-login" required autocomplete="username">
    <label for="c-pass">Password</label>
    <input id="c-pass" type="password" required autocomplete="current-password">
    <button class="go" type="submit">Get exchange code</button>
  </form>

  <div id="msg" role="status"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const msg = (text, ok) => { $('msg').textContent = text; $('msg').className = ok ? 'ok' : 'bad'; };

  function show(which) {
    $('register').hidden = which !== 'register';
    $('code').hidden = which !== 'code';
    $('tab-register').setAttribute('aria-selected', which === 'register');
    $('tab-code').setAttribute('aria-selected', which === 'code');
    msg('', true);
  }
  $('tab-register').onclick = () => show('register');
  $('tab-code').onclick = () => show('code');

  async function post(path, body) {
    const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.errorMessage || `Error ${res.status}`);
    return data;
  }

  fetch('/api/info').then((r) => r.json()).then((info) => {
    $('invite-wrap').hidden = !info.inviteRequired;
    if (!info.registration) { $('register').hidden = true; show('code'); $('tab-register').hidden = true; }
  }).catch(() => {});

  $('register').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const data = await post('/api/register', { email: $('r-email').value, displayName: $('r-name').value, password: $('r-pass').value, inviteCode: $('r-invite').value });
      msg(`Account created for ${data.displayName}. You can log in from the game now.`, true);
      e.target.reset();
    } catch (err) { msg(err.message, false); }
  };

  $('code').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const data = await post('/api/launcher/exchange', { login: $('c-login').value, password: $('c-pass').value });
      msg(`Code (good for ${Math.round(data.expiresInSeconds / 60)} min, one use): ${data.code}`, true);
    } catch (err) { msg(err.message, false); }
  };
</script>
</body>
</html>
