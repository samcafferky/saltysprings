<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OGFN Launcher</title>
  <style>
    :root { --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5d6470; --line: #d9dce2; --accent: #2f6fde; --ok: #1f8a4c; --bad: #c33b3b; --field: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --card: #1b1e25; --text: #eceef2; --muted: #9aa1ad; --line: #2e333d; --accent: #5b92f0; --ok: #46b97a; --bad: #e46a6a; --field: #14161b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
    main { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.sub { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }
    h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 6px; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--text); font: inherit; min-width: 0; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    button { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
    button.go { width: 100%; margin-top: 20px; border: 0; background: var(--accent); color: #fff; font-weight: 600; padding: 12px; }
    button.stop { width: 100%; margin-top: 8px; }
    button:disabled { opacity: .55; cursor: default; }
    .hint { font-size: .85rem; margin-top: 6px; color: var(--muted); overflow-wrap: anywhere; }
    .hint.ok { color: var(--ok); } .hint.bad { color: var(--bad); }
    details { margin-top: 14px; font-size: .9rem; }
    summary { cursor: pointer; color: var(--muted); }
    #status { margin-top: 14px; font-size: .95rem; overflow-wrap: anywhere; }
    #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>OGFN Launcher</h1>
  <p class="sub">Pick your build, log in, play on your server.</p>

  <h2>Game</h2>
  <label for="gamePath">Build folder</label>
  <div class="row">
    <input id="gamePath" placeholder="C:\Builds\14.60" spellcheck="false">
    <button id="browse" type="button">Browse…</button>
  </div>
  <div id="gameHint" class="hint"></div>

  <h2>Server</h2>
  <label for="serverUrl">Server address</label>
  <div class="row">
    <input id="serverUrl" placeholder="http://127.0.0.1:3551" spellcheck="false">
    <button id="check" type="button">Check</button>
  </div>
  <div id="serverHint" class="hint"></div>

  <h2>Account</h2>
  <label for="login">E-mail or display name</label>
  <input id="login" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <details>
    <summary>Advanced</summary>
    <label for="extraArgs">Extra launch arguments</label>
    <input id="extraArgs" placeholder="-log" spellcheck="false">
  </details>

  <button id="launch" class="go" type="button">Launch</button>
  <button id="stop" class="stop" type="button" hidden>Close game</button>
  <div id="status" role="status"></div>
</main>
<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  const fields = ['gamePath', 'serverUrl', 'login', 'extraArgs'];

  async function api(path, body) {
    const res = await fetch('/api/' + path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'content-type': 'application/json', 'x-launcher-token': token },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
    return data;
  }

  const hint = (id, text, ok) => { $(id).textContent = text; $(id).className = 'hint' + (text ? (ok ? ' ok' : ' bad') : ''); };
  const status = (text, ok) => { $('status').textContent = text; $('status').className = text ? (ok ? 'ok' : 'bad') : ''; };
  const values = () => Object.fromEntries(fields.map((f) => [f, $(f).value.trim()]));

  function showGame(game) {
    if (!$('gamePath').value.trim()) return hint('gameHint', '', true);
    if (!game) return hint('gameHint', 'Fortnite not found here. Pick the folder that has "FortniteGame" inside it.', false);
    hint('gameHint', 'Found ' + game.exe, true);
  }

  async function checkFolder() {
    try { showGame(await api('check-folder', { path: $('gamePath').value })); } catch { showGame(null); }
    api('settings', values()).catch(() => {});
  }

  async function checkServer() {
    try {
      const info = await api('server-status', { serverUrl: $('serverUrl').value });
      hint('serverHint', 'Connected to ' + info.name + '.', true);
    } catch (err) { hint('serverHint', err.message, false); }
  }

  function showState(state) {
    const running = state.status !== 'idle';
    $('launch').disabled = running;
    $('stop').hidden = state.status !== 'running';
    if (state.message) status(state.message, !/fail|error/i.test(state.message));
  }

  $('browse').onclick = async () => {
    try {
      const { path } = await api('pick-folder', {});
      if (path) { $('gamePath').value = path; checkFolder(); }
    } catch (err) { hint('gameHint', err.message, false); }
  };
  $('gamePath').onchange = checkFolder;
  $('check').onclick = checkServer;
  $('serverUrl').onchange = () => { checkServer(); api('settings', values()).catch(() => {}); };

  $('launch').onclick = async () => {
    $('launch').disabled = true;
    status('Starting...', true);
    try {
      await api('launch', { ...values(), password: $('password').value });
      $('password').value = '';
    } catch (err) { status(err.message, false); }
    refresh();
  };
  $('stop').onclick = async () => { await api('stop', {}).catch(() => {}); refresh(); };

  async function refresh() {
    try { showState((await api('state')).state); } catch {}
  }

  (async () => {
    try {
      const data = await api('state');
      for (const f of fields) $(f).value = data.settings[f] || '';
      showGame(data.game);
      showState(data.state);
      if (!data.windows) status('Fortnite only runs on Windows, so launching is turned off here.', false);
      checkServer();
    } catch (err) {
      status('Open the launcher from the link in its window. (' + err.message + ')', false);
    }
    setInterval(refresh, 2000);
  })();
</script>
</body>
</html>
